[package]
name = "keystone"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
include_dir = "0.7.4"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
surrealdb = "2.3.10"
tempfile = "3.22.0"
thiserror = "2.0.16"
time = { version = "0.3.44", features = ["serde"] }
tokio = { version = "1.47.1", features = ["full"] }
toml = "0.9.7"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
